name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install webclient dependencies
        working-directory: server/webclient
        run: bun install --frozen-lockfile

      - name: Install engine dependencies
        working-directory: server/engine
        run: bun install --frozen-lockfile

      # Checksum verify stays on, so content that drifts from the pack CRCs
      # (see "Pack checksums" in server/PATCHES.md) fails here, not on a fresh install.
      - name: Build game content for compiled-script regression tests
        working-directory: server/engine
        run: bun run build

      - name: Type-check, test, and verify generated docs
        run: bun run check
